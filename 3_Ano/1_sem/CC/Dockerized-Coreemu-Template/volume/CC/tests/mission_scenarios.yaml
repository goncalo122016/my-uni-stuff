tests:
  #TESTE 1
  - name: "Missão simples para 1 rover"
    missions:
      - rover: "R-001"
        area: {x1: 0, y1: 0, x2: 10, y2: 10}
        tasks: "scan_area"
        duration: 10
        progress_period: 3

  #TESTE 2
  - name: "Criar missão e abortar"
    missions:
      - rover: "R-002"
        area: {x1: 0, y1: 0, x2: 20, y2: 20}
        tasks: "collect_sample"
        duration: 25
        progress_period: 5
        abort_after: 10

  # TESTE 3
  # LEMBRAR de colocar a bateria em 23% antes de correr este teste
  - name: "Teste: Rover interrompe missão para carregar"
    missions:
      - rover: R-001
        area:
          x1: 50
          y1: 50
          z1: 0
          x2: 60
          y2: 60
          z2: 0
        tasks: "test_charging"
        duration: 100
        progress_period: 2

  # TESTE 4
  # LEMBRAR de colocar a temperatura em 99°C antes de correr este teste
  - name: "Teste: Rover sobreaquece e pausa missão"
    missions:
      - rover: R-001
        area:
          x1: 300
          y1: 300
          z1: 0
          x2: 310
          y2: 310
          z2: 0
        tasks: "test_overheating"
        duration: 200
        progress_period: 1

  # TESTE 5 - Concorrência de missões
  - name: "3 missões distribuídas pelos 3 rovers"
    missions:
      - rover: "R-001"
        area: {x1: 10, y1: 10, x2: 20, y2: 20}
        tasks: "thermal_inspection"
        duration: 40
        progress_period: 5
      - rover: "R-002"
        area: {x1: 30, y1: 30, x2: 40, y2: 40}
        tasks: "photo_capture"
        duration: 35
        progress_period: 5
      - rover: "R-003"
        area: {x1: 50, y1: 50, x2: 60, y2: 60}
        tasks: "mapping_survey"
        duration: 20
        progress_period: 2
