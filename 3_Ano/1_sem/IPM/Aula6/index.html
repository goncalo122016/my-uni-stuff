<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Jogo do Galo</title>
        <link href='https://fonts.googleapis.com/css?family=Anek Latin' rel='stylesheet'>
        <link rel="stylesheet" href="styles.css">
        <meta name="viewport" content="width=device-width,initial-scale=1">
    </head>
    <body>
        <div id="app">
            <h1>Jogo do Galo</h1>
            <h2 id="playerTurn">Vez do Jogador X</h2>
            <div id="gameBoard">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button id="resetButton">Reiniciar Jogo</button>
        </div>
        <script src="galo.js"></script>
    </body>
</html>
